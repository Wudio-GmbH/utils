name: 'NX Build'
description: 'Warm up Nx cache by building all projects'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '23.x'
  command:
    description: 'Nx build command'
    required: false
    default: 'nx run-many --target=build --all --verbose'
  location:
    description: 'Path to Nx workspace (e.g. workspace, workspace-homepage)'
    required: false
    default: 'workspace'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Prepare environment
      shell: bash
      run: |
        WS="${{ inputs.location }}"
        WS="${WS:-workspace}"
        WS="${WS%/}"
        rm -f "$WS/environments/src/lib/environments.ts"
        mv "$WS/environments/src/lib/environments.run.ts" "$WS/environments/src/lib/environments.ts"

    - name: Restore npm & Nx cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ${{ inputs.location }}/.nx
        key: build-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.location)) }}
        restore-keys: |
          build-${{ runner.os }}-${{ inputs.node-version }}-

    - name: Install dependencies & Build all Nx projects
      shell: bash
      working-directory: ${{ inputs.location }}
      run: |
        npm i
        npx nx --version
        ${{ inputs.command }}

    - name: Debug repo structure
      shell: bash
      run: |
        WS="${{ inputs.location }}"
        WS="${WS:-workspace}"
        WS="${WS%/}"
        pwd
        ls -lah
        ls -lah "$WS"
        ls -lah "$WS/.nx"
